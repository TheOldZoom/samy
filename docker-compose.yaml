services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
  environment:
    DATABASE_URL: postgresql://samy:${POSTGRES_PASSWORD}@db:5432/samy
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 20s

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: samy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: samy
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samy -d samy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
